<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول النصوص إلى تعليق صوتي للأفلام | واجهة عصرية</title>

    <!-- الخطوط العربية الافتراضية الاحترافية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #8b5cf6;
            --primary-light: #a78bfa;
            --primary-dark: #6d28d9;
            --secondary: #06b6d4;
            --secondary-light: #22d3ee;
            --accent: #f59e0b;
            --success: #10b981;
            --success-light: #34d399;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(139, 92, 246, 0.25);
            --border-hover: rgba(139, 92, 246, 0.5);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            line-height: 1.7;
        }

        .background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.15), transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.12), transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(245, 158, 11, 0.08), transparent 50%),
                var(--bg-dark);
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            padding: 30px 20px;
            z-index: 1;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            transition: all var(--transition);
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.4);
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c4b5fd, #a5f3fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-light), var(--secondary-light), transparent);
            margin: 20px auto 30px;
            border-radius: 3px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .char-count {
            margin-right: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .text-area {
            width: 100%;
            min-height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 1.05rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: all var(--transition);
        }

        .text-area:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        .select-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            padding: 12px 15px;
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .range-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .range-slider {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .button-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .primary-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary), var(--secondary));
            background-size: 200% 200%;
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.35);
            transition: all var(--transition);
        }

        .primary-btn:hover {
            background-position: 100% 100%;
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(139, 92, 246, 0.5);
        }

        .secondary-btn {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            padding: 12px;
            border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition);
        }

        .secondary-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: #f87171;
        }
    </style>
</head>
<body>

    <div class="background-canvas"></div>
    <div class="grid-overlay"></div>

    <div class="main-container">
        <div class="glass-card">
            
            <div class="header-section">
                <div class="logo-icon">🎙️</div>
                <h1 class="main-title">صانع المعلق الصوتي الذكي</h1>
                <p class="subtitle">توليد تعليق صوتي فخم لملخصات الأفلام أونلاين</p>
                <div class="divider"></div>
            </div>

            <!-- رفع الملف النصي كخيار إضافي -->
            <div class="input-section">
                <label class="input-label">📂 رفع ملف نصي .txt (اختياري)</label>
                <input type="file" id="fileInput" accept=".txt" class="select-input" style="padding: 8px;" />
            </div>

            <!-- صندوق النص المباشر -->
            <div class="input-section">
                <label class="input-label">
                    <span>✍️ نص التعليق الصوتي للأفلام:</span>
                    <span id="charCount" class="char-count">0 حرف</span>
                </label>
                <textarea id="textContainer" class="text-area" placeholder="اكتب السيناريو هنا مباشرة أو ارفع ملف نصي..."></textarea>
            </div>

            <!-- اختيار الأصوات الفخمة من المتصفح -->
            <div class="input-section">
                <label class="input-label">👤 اختيار المعلق الصوتي المتاح:</label>
                <select id="voiceSelect" class="select-input">
                    <option value="">⏳ جاري جلب الأصوات السحابية الذكية للمتصفح...</option>
                </select>
            </div>

            <!-- التحكم بالسرعة -->
